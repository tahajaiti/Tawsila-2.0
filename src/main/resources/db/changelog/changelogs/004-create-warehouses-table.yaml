databaseChangeLog:
  - changeSet:
      id: 004-create-warehouses-table
      author: admin
      labels: core, warehouses
      comment: "Create the 'warehouses' table to store logistics hub information and coordinates."

      changes:
        - createTable:
            tableName: warehouses
            remarks: "Stores data about warehouses including address, coordinates, and operating hours."
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_warehouses
                    nullable: false

              - column:
                  name: address
                  type: VARCHAR(255)
                  remarks: "Full address of the warehouse."
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: latitude
                  type: DECIMAL(10,8)
                  remarks: "Latitude coordinate of the warehouse location."
                  constraints:
                    nullable: false

              - column:
                  name: longitude
                  type: DECIMAL(11,8)
                  remarks: "Longitude coordinate of the warehouse location."
                  constraints:
                    nullable: false

              - column:
                  name: open_time
                  type: TIME
                  remarks: "Time the warehouse opens for operations."
                  constraints:
                    nullable: false

              - column:
                  name: close_time
                  type: TIME
                  remarks: "Time the warehouse closes for operations."
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_warehouses_coordinates
            tableName: warehouses
            columns:
              - column:
                  name: latitude
              - column:
                  name: longitude

      rollback:
        - dropTable:
            tableName: warehouses
