databaseChangeLog:
  - changeSet:
      id: 007-create-delivery-history-table
      author: admin
      labels: core, delivery_history
      comment: "Create 'delivery_history' table to track deliveries, planned vs actual times, and delays."

      changes:
        - createTable:
            tableName: delivery_history
            remarks: "Stores historical delivery data with relationships to delivery, customer, and tour."
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_delivery_history
                    nullable: false

              - column:
                  name: delivery_id
                  type: BIGINT
                  remarks: "Foreign key referencing the delivery."
                  constraints:
                    nullable: false

              - column:
                  name: customer_id
                  type: BIGINT
                  remarks: "Foreign key referencing the customer."
                  constraints:
                    nullable: false

              - column:
                  name: tour_id
                  type: BIGINT
                  remarks: "Foreign key referencing the tour (optional)."
                  constraints:
                    nullable: true

              - column:
                  name: delivery_date
                  type: DATE
                  remarks: "Date of the delivery."
                  constraints:
                    nullable: false

              - column:
                  name: planned_time
                  type: TIME
                  remarks: "Planned time for the delivery."
                  constraints:
                    nullable: false

              - column:
                  name: actual_time
                  type: TIME
                  remarks: "Actual time the delivery occurred."
                  constraints:
                    nullable: false

              - column:
                  name: delay_minutes
                  type: BIGINT
                  remarks: "Calculated delay in minutes between planned and actual delivery."

              - column:
                  name: day_of_week
                  type: VARCHAR(10)
                  remarks: "Day of the week for the delivery."

        - addForeignKeyConstraint:
            baseTableName: delivery_history
            baseColumnNames: delivery_id
            referencedTableName: deliveries
            referencedColumnNames: id
            constraintName: fk_delivery_history_delivery
            onDelete: CASCADE
            onUpdate: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: delivery_history
            baseColumnNames: customer_id
            referencedTableName: customers
            referencedColumnNames: id
            constraintName: fk_delivery_history_customer
            onDelete: RESTRICT
            onUpdate: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: delivery_history
            baseColumnNames: tour_id
            referencedTableName: tours
            referencedColumnNames: id
            constraintName: fk_delivery_history_tour
            onDelete: SET NULL
            onUpdate: RESTRICT

        - createIndex:
            indexName: idx_delivery_history_delivery_id
            tableName: delivery_history
            columns:
              - column:
                  name: delivery_id

        - createIndex:
            indexName: idx_delivery_history_customer_id
            tableName: delivery_history
            columns:
              - column:
                  name: customer_id

        - createIndex:
            indexName: idx_delivery_history_tour_id
            tableName: delivery_history
            columns:
              - column:
                  name: tour_id

      rollback:
        - dropTable:
            tableName: delivery_history
