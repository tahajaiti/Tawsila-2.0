databaseChangeLog:
  - changeSet:
      id: 002-create-tours-table
      author: admin
      labels: core, tours
      comment: "Create the 'tours' table to record vehicle tour schedules."

      changes:
        - createTable:
            tableName: tours
            remarks: "Stores tour information and links each tour to a vehicle."
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_tours
                    nullable: false

              - column:
                  name: date
                  type: DATE
                  remarks: "Date on which the tour takes place."
                  constraints:
                    nullable: false

              - column:
                  name: vehicle_id
                  type: BIGINT
                  remarks: "Foreign key referencing the assigned vehicle."
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: tours
            baseColumnNames: vehicle_id
            referencedTableName: vehicles
            referencedColumnNames: id
            constraintName: fk_tours_vehicle
            onDelete: CASCADE
            onUpdate: RESTRICT
            deferrable: false
            initiallyDeferred: false

        - createIndex:
            indexName: idx_tours_vehicle_id
            tableName: tours
            unique: false
            columns:
              - column:
                  name: vehicle_id

      rollback:
        - dropTable:
            tableName: tours
