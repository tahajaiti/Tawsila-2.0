databaseChangeLog:
  - changeSet:
      id: 001-create-vehicles-table
      author: tahajaiti
      labels: core, vehicles
      comment: "Create the 'vehicles' table to store vehicle type and capacity details."

      changes:
        - createTable:
            tableName: vehicles
            remarks: "Stores details about available vehicle types and their capacities."
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_vehicles
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  remarks: "Vehicle type, e.g., truck, van, bike."
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: max_weight_kg
                  type: DECIMAL(10,2)
                  remarks: "Maximum weight capacity in kilograms."
                  constraints:
                    nullable: false
              - column:
                  name: max_volume_m3
                  type: DECIMAL(10,2)
                  remarks: "Maximum volume capacity in cubic meters."
                  constraints:
                    nullable: false
              - column:
                  name: max_deliveries
                  type: INT
                  remarks: "Maximum number of deliveries the vehicle can handle."
                  constraints:
                    nullable: false

      rollback:
        - dropTable:
            tableName: vehicles
