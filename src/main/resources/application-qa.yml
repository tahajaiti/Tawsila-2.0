spring:
  datasource:
    url: ${QA_DB_URL}
    username: ${QA_DB_USER}
    password: ${QA_DB_PASSWORD}
    driver-class-name: ${QA_DB_DRIVER}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  liquibase:
    contexts: qa

  ai:
    azure:
      openai:
        api-key: ${AZURE_OPENAI_API_KEY}
        endpoint: ${AZURE_OPENAI_ENDPOINT}
        chat:
          options:
            deployment-name: ${AZURE_OPENAI_CHAT_DEPLOYMENT_NAME}
            model: ${AZURE_OPENAI_CHAT_MODEL}